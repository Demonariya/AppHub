[package]
name = "apphub"
version = "0.1.0"
description = "A premium Windows package store powered by WinGet"
authors = ["AppHub contributors"]
edition = "2021"

[lib]
name = "apphub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread"] }
which = "7"
thiserror = "2"
