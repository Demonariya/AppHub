name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Release AppHub (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          npm install
          node scripts/install-windows-deps.mjs

      - name: Run Type Checking & Linting
        run: npm run lint

      - name: Run Frontend & WinGet Integration Tests
        run: npx tsx scripts/test-runner.ts

      - name: Run Rust Automated Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Frontend Assets
        run: npm run build

      - name: Build Tauri Desktop Installers (NSIS & MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('AppHub {0}', github.ref_name) || '' }}
          releaseBody: 'Production release of AppHub Windows Package Store. See CHANGELOG.md for detailed release notes.'
          releaseDraft: false
          prerelease: false
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: --target x86_64-pc-windows-msvc

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AppHub-Windows-x64-Installers
          if-no-files-found: warn
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
