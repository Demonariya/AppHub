name: Build & Release AppHub

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Package AppHub (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          npm ci
          node scripts/install-windows-deps.mjs

      - name: Run Type Checking & Linting
        run: npm run lint

      - name: Run Frontend & WinGet Automated Tests
        run: npx tsx scripts/test-runner.ts

      - name: Run Rust Automated Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Build Frontend Assets
        run: npm run build

      # For Pull Requests and Main Branch: compile installers without publishing GitHub Release
      - name: Build Tauri Desktop Installers (CI / Main)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          projectPath: .

      # For Version Tags (v*): compile installers and publish official GitHub Release
      - name: Build & Publish Tauri Release (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'AppHub ${{ github.ref_name }}'
          releaseBody: |
            ## AppHub ${{ github.ref_name }}
            
            Official release of AppHub — Premium Windows Package Store powered by Microsoft WinGet.
            
            ### Included Windows Installers:
            - **NSIS Setup (.exe)**: Standard Windows desktop installer with automatic elevation and start menu integration.
            - **WiX Installer (.msi)**: Enterprise Windows Installer package for silent and managed group policy deployment.
            
            ### Verification:
            - Architecture: Windows x64 (`x86_64-pc-windows-msvc`)
            - Package Manager: Microsoft WinGet CLI engine
            - Cryptographic SHA256 integrity checked
            
            See [CHANGELOG.md](https://github.com/Demonariya/AppHub/blob/main/CHANGELOG.md) for full change history.
          releaseDraft: false
          prerelease: false

      - name: Verify Windows Installer Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $workspace = $env:GITHUB_WORKSPACE

          $nsisDir = Join-Path $workspace 'src-tauri/target/release/bundle/nsis'
          $msiDir = Join-Path $workspace 'src-tauri/target/release/bundle/msi'

          Write-Host 'Verifying AppHub Windows installers...'

          $nsisFiles = @(
              Get-ChildItem -LiteralPath $nsisDir -Filter '*.exe' -File -ErrorAction SilentlyContinue
          )

          $msiFiles = @(
              Get-ChildItem -LiteralPath $msiDir -Filter '*.msi' -File -ErrorAction SilentlyContinue
          )

          if ($nsisFiles.Count -eq 0) {
              throw ("Missing NSIS installer in: {0}" -f $nsisDir)
          }

          if ($msiFiles.Count -eq 0) {
              throw ("Missing MSI installer in: {0}" -f $msiDir)
          }

          $allInstallers = @($nsisFiles) + @($msiFiles)

          foreach ($file in $allInstallers) {
              if ($file.Length -lt 1000000) {
                  throw ("Installer is suspiciously small: {0} ({1} bytes)" -f $file.FullName, $file.Length)
              }

              $sizeMB = [math]::Round($file.Length / 1MB, 2)

              Write-Host (
                  "Verified installer: {0} | Size: {1:N2} MB | Path: {2}" -f
                  $file.Name,
                  $sizeMB,
                  $file.FullName
              )
          }

          Write-Host 'All required Windows installers successfully verified.'

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AppHub-Windows-x64-Installers
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi


